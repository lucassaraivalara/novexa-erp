# Explicit local profile: never reuse the generic DB_URL or remote Storage settings.
spring.config.import=optional:file:./config/local-secrets.properties
server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/novexa_erp
spring.datasource.username=${LOCAL_DB_USERNAME:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

novexa.jwt.secret=${LOCAL_JWT_SECRET}
novexa.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
novexa.geocoding.url=

# No remote Storage in local development. Image upload requires a separate service.
supabase.url=http://127.0.0.1:9
supabase.secret-key=local-development-no-remote-storage
supabase.bucket=local

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
