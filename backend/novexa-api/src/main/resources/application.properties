spring.application.name=novexa-api
server.port=${PORT:8080}

spring.config.import=optional:file:./config/application-local.properties

novexa.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://novexa-erp-prod.web.app,https://novexa-erp-prod.firebaseapp.com}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/novexa_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Baseline from existing schema
spring.flyway.validate-on-migrate=true

# Endpoint /search de um provedor compatível com Nominatim contratado ou próprio.
# Vazio mantém o preenchimento manual e não envia endereços a terceiros.
novexa.geocoding.url=${GEOCODING_URL:}
novexa.geocoding.user-agent=${GEOCODING_USER_AGENT:NovexaERP/1.0}

novexa.jwt.secret=${JWT_SECRET}
novexa.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.bucket=${SUPABASE_BUCKET}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
