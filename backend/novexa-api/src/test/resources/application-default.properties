# Test-only defaults: no private local config import, database or external services.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:novexa_test_defaults;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
novexa.jwt.secret=synthetic-test-only-key-at-least-32-bytes
supabase.url=http://127.0.0.1:9
supabase.secret-key=synthetic-test-only-storage-key
supabase.bucket=test
