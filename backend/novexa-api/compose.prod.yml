name: novexa

services:
  novexa-api:
    image: novexa-api:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novexa-api
    restart: unless-stopped
    env_file:
      - path: ${NOVEXA_ENV_FILE:-/etc/novexa/novexa-api.env}
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: ${NOVEXA_CONTAINER_PORT:-8080}
    ports:
      - "127.0.0.1:8080:${NOVEXA_CONTAINER_PORT:-8080}"
    mem_limit: ${NOVEXA_MEMORY_LIMIT:-2g}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
